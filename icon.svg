<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- SocialBudi blue gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle inner shadow for cookie depth -->
    <radialGradient id="cookieGradient" cx="45%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#F5C842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4920A;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="24" ry="24" fill="url(#bgGradient)" />

  <!-- Cookie circle body -->
  <circle cx="64" cy="64" r="42" fill="url(#cookieGradient)" />

  <!-- Cookie edge shading -->
  <circle cx="64" cy="64" r="42" fill="none"
    stroke="#B8780A" stroke-width="2.5" opacity="0.6" />

  <!-- Chocolate chips -->
  <ellipse cx="52" cy="52" rx="5.5" ry="4.5"
    fill="#5C3317" transform="rotate(-15 52 52)" />
  <ellipse cx="74" cy="50" rx="5" ry="4"
    fill="#5C3317" transform="rotate(10 74 50)" />
  <ellipse cx="45" cy="68" rx="4.5" ry="4"
    fill="#5C3317" transform="rotate(-20 45 68)" />
  <ellipse cx="68" cy="72" rx="5.5" ry="4.5"
    fill="#5C3317" transform="rotate(5 68 72)" />
  <ellipse cx="82" cy="65" rx="4" ry="3.5"
    fill="#5C3317" transform="rotate(15 82 65)" />
  <ellipse cx="58" cy="83" rx="5" ry="4"
    fill="#5C3317" transform="rotate(-10 58 83)" />

  <!-- Cookie bite notch (top-right) -->
  <circle cx="97" cy="36" r="16" fill="url(#bgGradient)" />

  <!-- "SB" text label -->
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="700" fill="white"
    text-anchor="middle" letter-spacing="1" opacity="0.95">SB</text>
</svg>
